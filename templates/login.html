<!doctype html>
<html>
<head>
  <title>Login</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 400px; margin: 80px auto; }
    input { display: block; width: 100%; padding: 8px; margin: 8px 0; box-sizing: border-box; }
    button { padding: 8px 16px; background: #2563eb; color: white; border: none; border-radius: 6px; cursor: pointer; }
    .flash { color: #b91c1c; }
  </style>
</head>
<body>
  <h2>Log In</h2>
  {% with messages = get_flashed_messages() %}
    {% if messages %}
      {% for m in messages %}<p class="flash">{{ m }}</p>{% endfor %}
    {% endif %}
  {% endwith %}
  <form method="post">
    <input type="text" name="username" placeholder="Username (alice)" required>
    <input type="password" name="password" placeholder="Password (password123)" required>
    <button type="submit">Log In</button>
  </form>
</body>
</html>
